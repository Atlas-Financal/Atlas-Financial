name: invented ledger simulator

on:
  pull_request:

permissions:
  contents: read

jobs:
  sample:
    name: Ledger simulator (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Install runtime dependencies
        run: bash scripts/ci-test.sh install-runtime
      - name: Replay the fixed synthetic sample
        run: |
          set -euo pipefail
          umask 077
          report="$RUNNER_TEMP/ledger-simulator.json"
          if ! node test/ledger-simulator/run.js --advisory --output "$report" > "$RUNNER_TEMP/ledger-simulator.log" 2>&1; then
            echo "Simulator execution or coverage failed."
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const bytes = fs.readFileSync(process.argv[1]);
            console.log("Synthetic sample SHA-256 " + crypto.createHash("sha256").update(bytes).digest("hex"));
          ' "$report"
