              const ROLE_PAIRS = [['lookback', 'past'], ['active', 'current'], ['future', 'next'], ['future', 'future']];
              for (const gr of groups.values()) {
                const pRole = item('period.' + gr.seg + '.role'), tRole = timelineOf(gr.seg);
                if (!owns('period.' + gr.seg + '.role') || !owns('period.' + gr.seg + '.timelineRole')
                  || !ROLE_PAIRS.some(([r, t]) => r === pRole && t === tRole)) invalid++;
              }
              if (funded) {
                const want = new Set(), byBase = new Map();
                for (const gr of groups.values()) {
