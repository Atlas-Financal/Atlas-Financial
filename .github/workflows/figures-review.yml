            }
            const digestState = key => {
              const valid = map => has(map, key) && typeof map[key] === 'string' && DIGEST.test(map[key]);
              return !valid(head) ? 'unknown' : !valid(base) ? 'introduced' : base[key] === head[key] ? 'unchanged' : 'changed';
            };
            const state = base === null ? 'introduced' : changed ? 'changed' : 'unchanged';
            const incomplete = invalid !== 0 || unobserved !== 0;
            const withheld = state !== 'unchanged' || inputs.added + inputs.edited + inputs.removed > 0;
            const expected = MARKER + '\n### Published figures - public summary\n\n'
              + 'Comparison: ' + state + '.\n'
              + 'Coverage: ' + (incomplete ? 'INCOMPLETE' : 'complete') + '.\n\n'
              + '| Publication family | Household compared | Household changed | Invented compared | Invented changed |\n'
              + '|---|---|---|---|---|\n'
              + FAMILIES.map((name, n) => '| ' + name + ' | ' + rows[n].join(' | ') + ' |').join('\n') + '\n\n'
              + 'Invented inputs: ' + inputs.common + ' compared like for like; ' + inputs.added + ' added; '
              + inputs.edited + ' edited; ' + inputs.removed + ' removed; ' + inputs.moved + ' fields moved on unedited inputs.\n'
              + 'Household dated opening input: ' + digestState('check.household.input.sha256') + '.\n'
              + 'Snapshot collector: ' + digestState('check.collector.sha256') + '.\n'
              + 'Field classes: ' + CLASSES.length + ' declared; ' + observed + ' observed by at least one input; '
              + byHousehold + ' observed by the household dated opening; ' + byInvented + ' observed by invented inputs; '
