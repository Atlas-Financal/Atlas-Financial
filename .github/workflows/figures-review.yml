                } else if (payPeriodState) {
                  // The selected view: itemized (iv) and in the anchor (sv).
                  const selected = selectedView(id.slice('budget|'.length));
                  const iv = itemized.get(selected), sv = a ? a.views.get(selected) : undefined;
                  const ofView = key => (sv ? sv[key] : 'invalid');
                  const cur = !!iv && iv.role === 'current', cal = g.calendar === 'yyyyyyyy';
                  const opu = !!iv && item('period.' + iv.date + '.operatingPlanUnavailable') === true;
                  if (funded) { push('budget', 'B0', A, topPlan); push('budget', 'A', A, top); }
                  if (funded && anyViews) push('budget', 'B', A, top);
                  if (anyViews) push('budget', 'C', srcA, topNull);
                  if (anyViews && top === 'object' && cal) push('budget', 'D', A, ofView('byView'));
                  if (anyViews && cal && g.dailyAsOf === 'y' && (cur ? top === 'object' : !!sv && sv.rawPacket !== 'none')) {
                    if (cur) push('budget', 'E', A, ofView('byView'));
                    else push('budget', 'E', ['other-object'], ofView('rawPacket'));
                  }
                  if (iv && iv.role !== 'past' && !opu) push('budget', 'F', srcA, topNull);
                  push('budget', 'G', srcA, topNull);
                  if (funded) push('budget', 'H', A, top);
                  const goals = !!iv && (funded || cur);
                  if (goals) push('budget', 'I', srcA, ofView('byId'));
                  if (goals && ofView('byId') === 'object' && g.inventory === 'y') {
                    if (cur) push('budget', 'J', A, ofView('byView'));
                    else push('budget', 'J', ['result'], 'object', 'I');
                  }
                  if (topNull === 'object' && g.inventory === 'y') push('budget', 'K', A, top);
                }
                // Observation i against step i: route, context shape, source role and
                // outcome. A pass-through names this state's matched goals call (step
                // I) and returns its result.
                if (st.obs.length !== steps.length) invalid++;
                let goalsCall = null;
                for (let i = 0; i < Math.min(st.obs.length, steps.length); i++) {
                  const ob = st.obs[i], step = steps[i];
                  if (ob.route !== step.route || ob.ctx !== step.ctx || step.src.indexOf(ob.src) < 0
                    || (step.outcome !== 'object' && step.outcome !== 'null') || ob.type !== step.outcome) { invalid++; continue; }
                  if (step.key === 'I') goalsCall = ob;
                  if (step.pass === 'I' && (!goalsCall || ob.source !== 'result#' + goalsCall.n || ob.ref !== goalsCall.ref)) invalid++;
                }
              }
              // Results: shape, manifest, parts and digest as before, plus the period
              // identity in one of the positive classes.
              const referenced = new Set();
              for (const ob of parsed.values()) if (ob.type === 'object') referenced.add(ob.ref);
              const table = new Map(), seenDigests = new Set();
              for (let k = 0; k < results; k++) {
                const r = 'r' + k;
                const shape = at(r + '.shape');
                if (!referenced.has(r) || !has(SHAPES, shape)) { invalid++; continue; }
                if (shape !== 'object') invalid++;
                let keys = at(r + '.keys'), names = null;
                if (shape === 'scalar') { if (keys !== undefined) invalid++; keys = ''; names = ['0']; }
                else {
                  try { names = JSON.parse(keys); } catch { names = null; }
                  if (!Array.isArray(names) || !names.every(x => typeof x === 'string') || new Set(names).size !== names.length
                    || (shape === 'array' && !names.every((x, j) => x === String(j)))) { invalid++; continue; }
                }
                const parts = names.map((_, j) => at(r + '.part.' + j));
                if (!parts.every(x => typeof x === 'string' && DIGEST.test(x))) { invalid++; continue; }
                const digest = at(r + '.digest');
                if (typeof digest !== 'string' || !DIGEST.test(digest) || digest !== sha256(shape + '\n' + keys + '\n' + parts.join('\n')) || seenDigests.has(digest)) invalid++;
                seenDigests.add(digest);
                for (const key of Object.keys(head)) {
                  if (!key.startsWith(root + r + '.part.')) continue;
                  const j = key.slice((root + r + '.part.').length);
                  if (!/^(0|[1-9]\d*)$/.test(j) || Number(j) >= names.length) invalid++;
                }
                const identity = at(r + '.identity');
                const idf = typeof identity === 'string' ? identity.split('|') : [];
                if (idf.length !== 6 || !has(PERIOD_CLASSES, idf[0]) || !idf.slice(1).every(x => x === 'absent' || DIGEST.test(x))
                  || idf[1] !== sha256(JSON.stringify(PERIOD_CLASSES[idf[0]]))) { invalid++; continue; }
                table.set(r, { names, parts, cls: idf[0], kind: idf[2], start: idf[3], end: idf[4], status: idf[5] });
              }
              // Each object observation's result against its binding and anchor.
              const lastBinding = new Map(), bindingsOf = new Map(), refsOf = new Map();
              for (const ob of parsed.values()) {
                if (ob.type !== 'object') continue;
                const res = table.get(ob.ref);
                if (!res) { invalid++; continue; }
                const scope = ob.page + '|' + ob.binding, bound = ob.page + '|' + ob.ref;
                // A result observed under another binding on the same page than at its
                // previous observation there.
                if (lastBinding.has(bound) && lastBinding.get(bound) !== ob.binding) invalid++;
                lastBinding.set(bound, ob.binding);
                if (!bindingsOf.has(bound)) bindingsOf.set(bound, new Set());
                bindingsOf.get(bound).add(ob.binding);
                if (!refsOf.has(scope)) refsOf.set(scope, new Set());
                refsOf.get(scope).add(ob.ref);
                const partOf = name => res.parts[res.names.indexOf(name)];
                for (const name of Object.keys(CONSTANT_PARTS)) if (CONSTANT_PARTS[name].map(stringPart).indexOf(partOf(name)) < 0) invalid++;
                if (partOf('asOf') !== stringPart(asOf)) invalid++;
                const status = partOf('status'), advice = ob.advice;
                if (ob.binding === 'V1') {
                  if (['v1-ready', 'v1-ready-withheld', 'v1-unknown'].indexOf(res.cls) < 0) { invalid++; continue; }
                  const mode = partOf('allocationMode'), combined = mode === stringPart('combined');
                  if (!combined && mode !== stringPart('historical-pools')) invalid++;
                  if ((partOf('manualInventory') === NULL_PART) !== combined) invalid++;
                  if (!combined && partOf('allocationDescription') !== stringPart(DESCRIPTIONS['historical-pools'])) invalid++;
                  if (!sameOrder(res.names, variantKeys(V1_KEYS, { goalAllocation: combined, reason: res.cls === 'v1-unknown' }))) invalid++;
                  if (status !== stringPart(res.cls === 'v1-ready' ? 'ready' : 'unavailable') || res.status !== status) invalid++;
                  if (status !== stringPart(advice.funding)) invalid++;
                  if (res.kind !== 'absent') invalid++;
                  // The view the anchor names as current.
                  const current = advice.views.get(advice.current);
                  if (res.cls === 'v1-unknown' ? res.start !== 'absent' || res.end !== 'absent'
                    : !current || res.start !== current.start || res.end !== current.end) invalid++;
                } else {
                  const view = advice.views.get(ob.binding.slice('V2:'.length));
                  if (!view || res.cls !== 'v2-packet' || view.role === 'current') { invalid++; continue; }
                  const projected = view.role === 'next' || view.role === 'future';
                  if (!sameOrder(res.names, variantKeys(V2_KEYS, { plannedRequirements: projected, forecastClosing: projected }))) invalid++;
                  if (partOf('allocationDescription') !== stringPart(DESCRIPTIONS[projected ? 'projected' : 'past'])) invalid++;
                  if (res.kind !== stringPart(projected ? 'projected' : 'historical')) invalid++;
                  if (res.start !== view.start || res.end !== view.end) invalid++;
                  if (res.status !== status) invalid++;
                  if (view.role === 'past' && status !== stringPart('unavailable')) invalid++;
                  if (ob.page === 'budget') {
                    const own = itemized.get(view.id);
                    if (!own || typeof own.status !== 'string' || status !== stringPart(own.status)) invalid++;
                  }
                }
              }
              // One result per page and binding, and one binding per page and result.
              for (const refs of refsOf.values()) if (refs.size !== 1) invalid++;
              for (const bindings of bindingsOf.values()) if (bindings.size > 1) invalid++;
              // A view key is allowed below its advice line's own views field, read as
              // a number (a malformed advice line is INVALID above in any case).
              const viewsAllowed = i => (typeof at('advice.' + i) === 'string' ? Number(at('advice.' + i).split('|')[5]) : NaN);
              for (const key of Object.keys(head)) {
                if (!key.startsWith(root)) continue;
                const inner = key.slice(root.length);
                if (/^(version|states|count|results|advices|gates)$/.test(inner)) continue;
                let m = /^state\.(0|[1-9]\d*)$/.exec(inner);
                if (m) { if (Number(m[1]) >= states) invalid++; continue; }
                m = /^gate\.(0|[1-9]\d*)$/.exec(inner);
                if (m) { if (Number(m[1]) >= gates) invalid++; continue; }
                m = /^o(0|[1-9]\d*)$/.exec(inner);
                if (m) { if (Number(m[1]) >= count) invalid++; continue; }
                m = /^r(0|[1-9]\d*)\.(digest|keys|shape|identity|part\.(?:0|[1-9]\d*))$/.exec(inner);
                if (m) { if (Number(m[1]) >= results) invalid++; continue; }
                m = /^advice\.(0|[1-9]\d*)(?:\.view\.(0|[1-9]\d*))?$/.exec(inner);
