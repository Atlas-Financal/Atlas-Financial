                  + 'figure-level diff with the merge card and every declared field class is observed by at least one input.'
                : withheld
                  ? 'Figures acceptance: WITHHELD until the owner privately reconciles the exact-base/head figure-level diff '
                    + 'with the merge card.'
                  : incomplete
                    ? 'Figures acceptance: INCOMPLETE until every declared field class is observed by at least one input and '
                      + 'the coverage manifest reconciles; an unchanged comparison does not cover unobserved classes.'
                    : 'Figures acceptance: no compared field moved on the household dated opening or the invented inputs; '
                      + 'items listed as not covered are outside this result.') + '\n';
            if (body !== expected) throw new Error('invalid-public-summary');
            const headSha = context.payload.pull_request.head.sha;
            const baseSha = context.payload.pull_request.base.sha;
            if (!/^[a-f0-9]{40}$/.test(headSha) || !/^[a-f0-9]{40}$/.test(baseSha))
