                  byBase.get(gr.base).push(gr);
                }
                for (const [base, list] of byBase) {
                  list.sort((x, y) => x.ordinal - y.ordinal).forEach((gr, k) => want.add('savings.period.' + base + (k === 0 ? '' : '#' + (k + 1))));
                }
                curGroups.forEach((gr, k) => want.add('savings.current' + (k === 0 ? '' : '#' + (k + 1))));
                const got = new Set();
                for (const key of ownKeys) {
                  const pm = /^(savings\.current(?:#\d+)?|savings\.period\.[^.]+)\./.exec(key);
                  if (pm) got.add(pm[1]);
                }
                for (const p of got) if (!want.has(p)) invalid++;
                for (const p of want) {
                  if (!owns(p + '.publication')) { invalid++; continue; }
                  const publication = item(p + '.publication');
                  if (publication !== 'published' && publication !== 'withheld') invalid++;
                  else if (publication === 'withheld' && ownKeys.some(key => key.indexOf(p + '.') === 0 && key !== p + '.publication')) invalid++;
                  else if (publication === 'published' && !owns(p + '.status')) invalid++;
