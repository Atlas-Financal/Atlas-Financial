                    if (g.monthPayday !== 'y' && g.monthPayday !== 'n') invalid++;
                    if (g.monthPayday === 'y') push('month', 'M2', A, top);
                  } else if (funded) {
                    if (g.monthPayday !== '-' || g.monthId !== '-') invalid++;
                  } else if (g.monthId !== 'other' && g.monthId !== '-') invalid++;
                } else if (id === 'budget|drilldown') {
                  if (funded) push('drilldown', 'B0', A, topPlan);
