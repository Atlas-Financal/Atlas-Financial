# The financial publication correctness suite.
#
# No production secrets are used or needed. Synthetic SITE_PASSWORD /
# SESSION_SECRET values exist only in the local production-boundary suite so
# authenticated `/data.json` can be proved without a deployed instance.
name: tests

on:
  # Pull requests run the suite on their merge-ref; main runs it on every merge.
  # A branch push is not a separate trigger: it would repeat the same suite on
  # the same commits for every PR push.
  push:
    branches: [main]
  pull_request:
  # Merge queue: the same jobs run on the exact commit the queue will land
  # (main plus the queued PR). That run, not a manual catch-up, is what keeps
  # sprint rule 4's "green on exactly what lands" (docs/RISK_LABELS.md).
  merge_group:
    types: [checks_requested]

# A newer push to the same PR supersedes the run still in flight. Main and
# merge-queue runs are never cancelled or replaced while queued (each gets its
# own group): every merge must be tested to know which one broke main.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Separate jobs get independent GitHub-hosted workspaces. Within each job
  # the explicit manifest remains serial: suites mutate shared checkout files.
  #
  # The standard group runs as six parallel shards. test/test.js computes the
  # split (shardSuites): every standard suite is in exactly one shard, and
  # test-ci-split.js proves it. The shard count here must equal SHARD_COUNT.
  standard-shard:
    name: standard shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to completion, so one red shard never hides another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          # B20 independent proof reads historical `data.json` / `positions.csv`
          # via `git show 81210ac` and `git show 08fd3e1`. The default shallow
          # checkout cannot see those commits, so the required suite would go
          # red without the history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      # express is the production server runtime. The production-boundary
      # suite starts server.js locally with synthetic secrets.
      - name: Install runtime dependencies
        run: bash scripts/ci-test.sh install-runtime

      - name: Run the correctness suite
        env:
          ATLAS_CI_SHARD: ${{ matrix.shard }}/6
        run: bash scripts/ci-test.sh standard

      # Local commits run .githooks/pre-commit, which delegates to
      # scripts/privacy-guard.js. GitHub API commits never run that hook.
      # privacy-guard.yml applies the trusted default-branch copy of the same
      # engine. This step only proves both files are still shipped.
      # test/test-static.js keeps a generic card/SIN scan, not a second household
      # identifier list.
      - name: Confirm the privacy-guard engine is still present
        run: test -f .githooks/pre-commit && test -f scripts/privacy-guard.js

  # The required `standard` context. It runs even when a shard failed, was
  # cancelled or was skipped, and is green only when every shard succeeded.
  standard:
    name: standard
    needs: [standard-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every standard shard to succeed
        env:
          SHARDS_RESULT: ${{ needs.standard-shard.result }}
        run: |
          printf 'standard shards=%s\n' "$SHARDS_RESULT"
          if [ "$SHARDS_RESULT" != success ]; then
            exit 1
          fi

  refresh-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # B92 clones this history for its unchanged mutation/anti-mutation proof.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install runtime dependencies
        run: bash scripts/ci-test.sh install-runtime

      - name: Run the refresh-isolation suite
        run: bash scripts/ci-test.sh refresh-isolation

      - name: Confirm the privacy-guard engine is still present
        run: test -f .githooks/pre-commit && test -f scripts/privacy-guard.js

  # Keep the existing check name and workflow name for branch checks. Never turn an absent or non-success result green.
  test:
    name: test
    needs: [standard, refresh-isolation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every suite job to succeed
        env:
          STANDARD_RESULT: ${{ needs.standard.result }}
          REFRESH_ISOLATION_RESULT: ${{ needs.refresh-isolation.result }}
        run: |
          printf 'standard=%s refresh-isolation=%s\n' "$STANDARD_RESULT" "$REFRESH_ISOLATION_RESULT"
          if [ "$STANDARD_RESULT" != success ] || [ "$REFRESH_ISOLATION_RESULT" != success ]; then
            exit 1
          fi
