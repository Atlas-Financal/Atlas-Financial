# B77: GitHub API / connector commits never run the local pre-commit hook.
# This job applies the incumbent engine (`scripts/privacy-guard.js`) from the
# trusted default branch to the incoming write. The PR cannot supply the
# guard that judges it. The identifier/secret list lives only in that engine;
# this workflow does not keep a second copy.
#
# Under pull_request_target the job SHA is the default-branch commit, so the
# check that branch protection can require is the `privacy-guard` commit
# status published onto the PR head. Adding that context to required checks
# on `main` is an owner repository-setting action.
#
# Merge queue: under `merge_group` the job scans the exact queue commit (main
# plus the queued PR) against its base with the guard from that base commit,
# which is on `main`. The job's own check run is the required result there;
# the PR-head commit status is published only for pull requests. The
# trusted-definition run on the PR head must already be green before GitHub
# lets the PR join the queue.
name: Incumbent privacy guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  statuses: write

concurrency:
  # Each merge group gets its own group so a queued run is never replaced.
  group: privacy-guard-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: false

jobs:
  privacy-guard:
    name: Incumbent privacy guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mark the exact head pending
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.createCommitStatus({
                ...context.repo,
                sha: context.payload.pull_request.head.sha,
                state: 'pending',
                context: 'privacy-guard',
                description: 'Applying the incumbent raw-data / identifier / secret guard…',
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            } catch (error) {
              try { require('fs').writeFileSync(process.env.RUNNER_TEMP + '/privacy-guard-pending.private.log',
                String(error.stack || error), { mode: 0o600 }); } catch { /* Keep diagnostic failures private. */ }
              core.setFailed('Privacy guard pending status failed; private diagnostics withheld.');
            }

      - name: Checkout trusted default-branch guard
        if: always()
        uses: actions/checkout@v4
        with:
          # A merge group is judged by the guard on its base, a commit on main.
          ref: ${{ github.event.merge_group.base_sha || github.event.repository.default_branch }}
          persist-credentials: false
          path: trusted

      - name: Checkout the write under test as data
        if: always()
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          persist-credentials: false
          fetch-depth: 0
          path: incoming

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '20'

      - name: Scan incoming files with the trusted guard
        id: scan
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != "pull_request_target" && "${EVENT_NAME}" != "merge_group" ]]; then
            echo "privacy-guard failed closed: unsupported event."
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "pull_request_target" && ! "${EVENT_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "privacy-guard failed closed: event did not identify the pull request."
            exit 1
          fi
          if [[ ! "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "privacy-guard failed closed: event did not identify a 40-character head SHA."
            exit 1
          fi
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "privacy-guard failed closed: event did not identify a 40-character base SHA."
            exit 1
          fi
          if [[ ! -f trusted/scripts/privacy-guard.js ]]; then
            echo "privacy-guard failed closed: trusted default branch is missing scripts/privacy-guard.js."
            exit 1
          fi
          if [[ ! -d incoming/.git ]]; then
            echo "privacy-guard failed closed: incoming write was not checked out as data."
            exit 1
          fi
          # Never execute incoming JS. The engine that judges the write is the
          # trusted default-branch copy; incoming files are read as data.
          node trusted/scripts/ci-output.js --identity privacy-guard -- node trusted/scripts/privacy-guard.js --root incoming --changed-from "${BASE_SHA}"

      - name: Publish exact-head status
        if: always() && github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const scan = '${{ steps.scan.outcome }}';
              const state = scan === 'success' ? 'success' : 'failure';
              const description = state === 'success'
                ? 'Incumbent privacy guard accepted the write.'
                : 'Incumbent privacy guard rejected the write or failed closed.';
              await github.rest.repos.createCommitStatus({
                ...context.repo,
                sha: context.payload.pull_request.head.sha,
                state,
                context: 'privacy-guard',
                description,
                target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              if (state !== 'success') {
                core.setFailed(description);
              }
            } catch (error) {
              try { require('fs').writeFileSync(process.env.RUNNER_TEMP + '/privacy-guard-final.private.log',
                String(error.stack || error), { mode: 0o600 }); } catch { /* Keep diagnostic failures private. */ }
              core.setFailed('Privacy guard final status failed; private diagnostics withheld.');
            }
