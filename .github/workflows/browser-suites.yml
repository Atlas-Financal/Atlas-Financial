# Browser suites (test/browser-*.js), run as an ADVISORY check.
#
# Runs the browser suites that pass on main, serially, in headless Chromium
# with invented data (scripts/browser-suites.js lists them, and classifies
# every other browser suite with the reason it is not run). The job fails when
# a listed suite fails or when a browser suite on disk is unclassified.
#
# Not a required status check; making it required is a ruleset decision for
# the lead/owner. Suite output stays in private temporary files; only
# "<suite> pass|fail" lines and a summary are printed.
name: browser suites

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: browser-suites-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  browser-suites:
    name: browser suites (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Install runtime dependencies
        run: bash scripts/ci-test.sh install-runtime

      # Playwright is not a runtime dependency; pin it here for the job only.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0 > /dev/null
          npx --no-install playwright install --with-deps chromium > /dev/null

      - name: Run the passing browser suites
        run: node scripts/browser-suites.js
